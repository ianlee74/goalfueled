<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7faf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1512" />
    <meta name="description" content="GoalFueled — define and track meal plans to reach your health goals." />
    <title>GoalFueled</title>
    <!-- Brand typography: Barlow Condensed carries numerals/headlines, Inter carries body/UI. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap"
    />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme.
         Mirrors the logic in src/theme/theme.ts (kept tiny and dependency-free). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('gf.theme') || 'system'
          var theme = pref
          if (pref === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
