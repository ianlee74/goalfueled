name: Deploy

# Manual-only deploy of the API (Azure Functions) and web (Static Web Apps).
# Inert until you configure the secrets/vars below — it never runs automatically.
#
# Required secrets:
#   AZURE_FUNCTIONAPP_PUBLISH_PROFILE   publish profile XML of the Function App
#   AZURE_STATIC_WEB_APPS_API_TOKEN     deployment token of the Static Web App
# Required variables:
#   AZURE_FUNCTIONAPP_NAME              name of the deployed Function App

on:
  workflow_dispatch:

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: dotnet publish src/GoalFueled.Api/GoalFueled.Api.csproj -c Release -o ./publish
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/web
          output_location: dist
